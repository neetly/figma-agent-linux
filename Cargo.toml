[package]
name = "figma-agent"
version = "0.4.3"
edition = "2024"

[dependencies]
anyhow = "=1.0.104"
axum = "=0.8.9"
fontconfig-parser = "=0.5.8"
harfrust = "=0.13.3"
interp = "=2.1.2"
itertools = "=0.15.0"
jsonc-parser = { version = "=0.33.1", features = ["serde"] }
listenfd = "=1.0.2"
read-fonts = "=0.43.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
skrifa = "=0.46.2"
svg = "=0.18.0"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["full"] }
tower = { version = "=0.5.3", features = ["full"] }
tower-http = { version = "=0.7.1", features = ["full"] }
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
walkdir = "=2.5.0"
xdg = "=3.0.0"
